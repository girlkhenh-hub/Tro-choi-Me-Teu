<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Bé săn tìm chữ – Mẹ Tễu</title><style>
:root{font-family:system-ui,-apple-system,'Segoe UI',sans-serif;color:#13526a}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:linear-gradient(160deg,#dff8ff,#fff4fa 55%,#e4ffeb);padding:16px}.app{max-width:760px;margin:auto;background:#ffffffeb;border:5px solid #31b6e8;border-radius:30px;padding:18px;box-shadow:0 12px 35px #0a76952b;text-align:center}header{position:relative}h1{font-size:clamp(26px,6vw,42px);margin:8px 0;color:#007d98;text-shadow:1px 2px #c7f3ff}.brand{display:inline-block;background:#fff;border:2px dashed #ed64aa;color:#a30094;border-radius:25px;padding:6px 14px;font-weight:900}h2{font-size:20px;margin:12px 0;color:#ed3c55}.stats{display:flex;justify-content:space-around;gap:8px;flex-wrap:wrap;font-weight:750}.pill{background:#eaf9ff;padding:8px 12px;border-radius:20px}.hero{display:flex;align-items:center;justify-content:center;gap:15px;margin:18px 0 12px}.picture{font-size:clamp(64px,17vw,125px);filter:drop-shadow(2px 6px 2px #b5d4e0)}.bigletter{font-size:clamp(100px,25vw,185px);line-height:1;font-weight:1000;color:#c82dc7;text-shadow:4px 5px #f3c7f5}.instruction{font-size:19px;font-weight:750;margin:10px 0}.choices{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;margin:14px 0}.choice{aspect-ratio:1;border-radius:50%;border:3px solid #1699d4;background:linear-gradient(#fff,#d9f4ff);color:#20242d;font-size:clamp(25px,6vw,44px);font-weight:900;cursor:pointer;box-shadow:0 3px #9cd9f5}.choice:disabled{opacity:.8}.choice.good{background:#a7f4a6;border-color:#18a14b}.choice.bad{background:#ffd3dc;border-color:#e85e79}.feedback{min-height:32px;font-weight:850;font-size:20px;color:#d42c8e}.controls{display:flex;justify-content:center;flex-wrap:wrap;gap:10px}button.action{border:0;border-radius:16px;padding:12px 16px;background:#00a8cf;color:white;font-size:16px;font-weight:850;cursor:pointer}.action.secondary{background:#ef69aa}.action:disabled{opacity:.45}footer{margin-top:18px;font-weight:800;color:#11849d}.small{font-size:13px;color:#537a86;margin-top:8px}.stars{font-size:25px}.confetti{animation:pop .4s ease}@keyframes pop{50%{transform:scale(1.13)}}@media(max-width:430px){.app{padding:11px;border-width:4px}.choices{gap:6px}.choice{border-width:2px}.hero{gap:8px}}
</style></head><body><main class="app"><header><span class="brand">💗 Mẹ Tễu 💗</span><h1>🐚 BÉ SĂN TÌM CHỮ ⭐</h1><h2>Bé tìm và chạm vào chữ cái giống chữ mẫu nhé!</h2></header><div class="stats"><span class="pill" id="progress"></span><span class="pill" id="score"></span><span class="pill" id="found"></span></div><div class="hero"><div class="picture" id="picture" aria-hidden="true"></div><div class="bigletter" id="target"></div></div><div class="instruction" id="instruction"></div><div class="choices" id="choices"></div><div class="feedback" id="feedback" aria-live="polite"></div><div class="stars" id="stars"></div><div class="controls"><button class="action" id="listen">🔊 Nghe chữ</button><button class="action" id="next">➡️ Chữ tiếp theo</button><button class="action secondary" id="restart">🔄 Chơi lại</button></div><footer>❤️ Chúc bé học vui ❤️</footer><div class="small">Trò chơi học chữ tiếng Việt – Mẹ Tễu • Có thể chơi trên điện thoại và máy tính</div></main><script>
const lessons=[['a','🐟','cá'],['ă','🌙','mặt trăng'],['â','🧦','đôi tất'],['b','🦋','bướm'],['c','🐟','cá'],['d','🥥','dừa'],['đ','🚲','xe đạp'],['e','👶','em bé'],['ê','🐸','ếch'],['g','🐔','gà'],['h','🐯','hổ'],['i','🖊️','bút bi'],['k','🍬','kẹo'],['l','🍃','lá'],['m','🐱','mèo'],['n','🍄','nấm'],['o','🐝','ong'],['ô','🚗','ô tô'],['ơ','🍑','quả mơ'],['p','🔦','đèn pin'],['q','🎁','quà'],['r','🐢','rùa'],['s','🐿️','sóc'],['t','🐰','thỏ'],['u','🍈','đu đủ'],['ư','🍉','dưa hấu'],['v','📒','vở'],['x','🛵','xe máy'],['y','🩺','y tá']];
let index=0,score=0,found=0,done=false,wrong=new Set(),round=[];const $=id=>document.getElementById(id);function shuffle(a){for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}function speak(text){if(!('speechSynthesis' in window))return;speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(text);u.lang='vi-VN';u.rate=.78;speechSynthesis.speak(u)}
function setup(){done=false;wrong=new Set();const [letter,emoji,word]=lessons[index];$('target').textContent=letter;$('picture').textContent=emoji;$('instruction').textContent='Tìm tất cả chữ “'+letter+'” trong các bong bóng!';$('feedback').textContent='';$('stars').textContent='';$('progress').textContent='Chữ '+(index+1)+' / '+lessons.length;$('score').textContent='⭐ Điểm: '+score;$('found').textContent='Đã tìm: 0 / 4';$('next').disabled=true;let distractors=shuffle(lessons.map(x=>x[0]).filter(x=>x!==letter)).slice(0,11);round=shuffle([letter,letter,letter,letter,...distractors]);const area=$('choices');area.innerHTML='';round.forEach((c,i)=>{let b=document.createElement('button');b.className='choice';b.textContent=c;b.setAttribute('aria-label','Chữ '+c);b.onclick=()=>choose(b,c,letter);area.appendChild(b)});found=0}
function choose(btn,c,target){if(btn.disabled)return;if(c===target){btn.classList.add('good');btn.disabled=true;found++;score+=10;$('score').textContent='⭐ Điểm: '+score;$('found').textContent='Đã tìm: '+found+' / 4';$('feedback').textContent='🎉 Giỏi quá! Bé tìm đúng rồi!';$('stars').textContent='⭐'.repeat(found);if(found===4){done=true;$('feedback').textContent='🏆 Xuất sắc! Bé đã tìm đủ 4 chữ '+target+'!';$('next').disabled=false;speak('Giỏi lắm! Bé đã tìm đúng tất cả chữ '+target)}}else{btn.classList.add('bad');btn.disabled=true;$('feedback').textContent='💕 Chưa đúng, bé thử lại nhé!'}}
$('listen').onclick=()=>speak('Chữ '+lessons[index][0]+'. '+lessons[index][2]);$('next').onclick=()=>{if(!done)return;if(index===lessons.length-1){$('feedback').textContent='🎊 Chúc mừng bé đã hoàn thành bảng chữ cái!';$('next').disabled=true;return}index++;setup()};$('restart').onclick=()=>{index=0;score=0;setup()};setup();
</script></body></html>
