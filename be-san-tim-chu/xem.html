
<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bé săn tìm chữ - Mẹ Tễu - Tự chạy</title>
 <style>
 const w=frame.contentWindow;
 const d=frame.contentDocument;
 if(!d)return;
 let count=0;
 let wait=0;
 timer=setInterval(()=>{
  const buttons=[...d.querySelectorAll('.choice')];
  const target=d.getElementById('target')?.textContent;
  if(!target)return;
  const correct=buttons.find(b=>
    b.textContent===target && !b.disabled
  );
  if(correct){
    correct.click();
    count=0;
    return;
  }
  if(++wait>=2){
    wait=0;
    const next=d.getElementById('next');
    if(next && !next.disabled){
      if(d.getElementById('progress')?.textContent.includes('29 / 29')){
        d.getElementById('restart')?.click();
      }else{
        next.click();
      }
    }
  }
 },1800);
});
</script>
</body>
</html>
