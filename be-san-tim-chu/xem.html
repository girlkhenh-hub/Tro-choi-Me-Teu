
<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bé săn tìm chữ - Mẹ Tễu - Tự chạy</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden}
iframe{width:100%;height:100%;border:0;pointer-events:none}
</style>
</head>
<body>
<iframe id="game" src="./index.html"></iframe>
<script>
const frame=document.getElementById('game');
let timer;
frame.addEventListener('load',()=>{
 clearInterval(timer);
 const w=frame.contentWindow;
 const d=frame.contentDocument;
 if(!d)return;
 let count=0;
 let wait=0;
 timer=setInterval(()=>{
  const buttons=[...d.querySelectorAll('.choice')];
  const target=d.getElementById('target')?.textContent;
  if(!target)return;
  const correct=buttons.find(b=>
    b.textContent===target && !b.disabled
  );
  if(correct){
    correct.click();
    count=0;
    return;
  }
  if(++wait>=2){
    wait=0;
    const next=d.getElementById('next');
    if(next && !next.disabled){
      if(d.getElementById('progress')?.textContent.includes('29 / 29')){
        d.getElementById('restart')?.click();
      }else{
        next.click();
      }
    }
  }
 },1800);
});
</script>
</body>
</html>
